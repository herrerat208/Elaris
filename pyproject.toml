[project]
name = "elaris"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.0",
    "dj-database-url>=2.1",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "whitenoise>=6.6",
    "gunicorn>=22.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "node_modules", "staticfiles", "media", "design", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"