[project]
name = "elaris"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "Django==5.2.19",
    "dj-database-url==3.1.2",
    "python-dotenv==1.2.4",
    "psycopg[binary]==3.3.8",
    "whitenoise==6.12.0",
    "gunicorn==26.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "node_modules", "staticfiles", "media", "design", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"