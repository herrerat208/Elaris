{% if messages %}
  <div class="container-page pt-4">
    <div class="space-y-2">
      {% for message in messages %}
        <div class="rounded-2xl border px-4 py-3 text-sm font-medium shadow-sm
          {% if message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800
          {% elif message.tags == 'error' %}border-red-200 bg-red-50 text-red-800
          {% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800
          {% else %}border-celeste/40 bg-celeste-soft text-ink{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  </div>
{% endif %}
