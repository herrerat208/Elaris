{% load static %}
<!doctype html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf5ec">
  <meta name="description" content="Elaris es el espacio de gestión para profesionales de la belleza.">
  <title>{% block title %}Elaris · turnos de belleza{% endblock %}</title>

  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'brand/favicon-32.png' %}">
  <link rel="apple-touch-icon" href="{% static 'brand/favicon-180.png' %}">
  <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Elaris">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20261112-4">
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}?v=20261112-4" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-cream text-ink">
  {% block body %}{% endblock %}
</body>
</html>
